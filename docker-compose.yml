# Production stack. Secrets and environment values come from the root .env.
# Copy .env.example and set API_TOKEN, CLIENT_TOKEN, and PG_PASSWORD.
# For local development (hot reload and a locally managed edge network):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  # Postgres backs the roster-history diff store and the user-search cache.
  # The server runs its migrations on startup and will not boot until this is
  # reachable, so it comes up first as part of the stack — no setup required.
  postgres:
    image: postgres:16-alpine
    container_name: meuapps-postgres
    restart: always
    environment:
      POSTGRES_DB: cavapps
      POSTGRES_USER: cavapps
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cavapps -d cavapps"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - meuapps-network

  server:
    restart: always
    build:
      dockerfile: "./server.Dockerfile"
      context: "./server"
    container_name: meuapps-server
    #labels:
    #- com.centurylinklabs.watchtower.enable=true
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      API_TOKEN: ${API_TOKEN}
      CLIENT_TOKEN: ${CLIENT_TOKEN}
      API_BASE_URL: ${API_BASE_URL:-https://api.15thmeu.org}
      FORUM_BASE_URL: ${FORUM_BASE_URL:-https://15thmeu.org}
      DATABASE_URL: postgres://cavapps:${PG_PASSWORD:?Set PG_PASSWORD in .env}@postgres:5432/cavapps?sslmode=disable
      DIFF_POLL_SCHEDULE: ${DIFF_POLL_SCHEDULE:-*/15 * * * *}
      # Optional: the roster-history diff viewer and member search read from the
      # live XenForo (forum) MariaDB. Leave these blank for local dev; the core
      # roster works without them. Without XenForo the diff poller just logs a
      # connection error each tick and moves on (the diff viewer stays empty),
      # and the user-search index is never built, so the member-search box
      # returns an error rather than results. Fill them in if you have a
      # reachable XenForo database (e.g. an SSH tunnel or a read replica).
      XENFORO_DB_HOST: ${XENFORO_DB_HOST:-}
      XENFORO_DB_PORT: ${XENFORO_DB_PORT:-3306}
      XENFORO_DB_USER: ${XENFORO_DB_USER:-}
      XENFORO_DB_PASSWORD: ${XENFORO_DB_PASSWORD:-}
      XENFORO_DB_NAME: ${XENFORO_DB_NAME:-xenforo}
    working_dir: /server
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - edge
      - meuapps-network

  client:
    restart: always
    build:
      context: ./client
      dockerfile: ./client.Dockerfile
    container_name: meuapps-client
    #labels:
    #- com.centurylinklabs.watchtower.enable=true
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_CLIENT_TOKEN: ${CLIENT_TOKEN}
      # Server-side fetches (Next.js route handlers / server components) reach the
      # server over the internal Docker network.
      COMBAT_API_URL: http://server:4000/roster/combat
      RESERVE_API_URL: http://server:4000/roster/reserves
      CACHE_TIMESTAMP_URL: http://server:4000/cache-timestamp
      GROUP_API_URL: http://server:4000/roster/groups
      # NEXT_PUBLIC_* values are baked into the browser bundle, so they must point
      # at a URL the browser can reach, not the internal `server` host.
      # Set these to the public API endpoints in production.
      NEXT_PUBLIC_DIFF_API_URL: ${NEXT_PUBLIC_DIFF_API_URL:-https://bff.apps.15thmeu.org}
      NEXT_PUBLIC_USERCACHE_API_URL: ${NEXT_PUBLIC_USERCACHE_API_URL:-https://bff.apps.15thmeu.org/userSearch}
      NEXT_PUBLIC_INDIVIDUAL_API_URL: ${NEXT_PUBLIC_INDIVIDUAL_API_URL:-https://bff.apps.15thmeu.org/roster/individual}
    working_dir: /client
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - edge
      - meuapps-network

networks:
  edge:
    external: true
    name: edge
  meuapps-network:
    driver: bridge

volumes:
  pgdata:
    name: cavapps_pgdata
